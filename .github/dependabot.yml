version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 2
    groups:
      androidx:
        patterns: ["androidx.*"]
        update-types: ["minor", "patch"]
      material:
        patterns: ["com.google.android.material*"]
        update-types: ["minor", "patch"]
    ignore:
      # AGP major (8.5.2 → 9.x) = разваливает BouncyCastle/AGP
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major"]
      # Kotlin major = ломает BC 1.78.1 + coroutines API
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlinx*"
        update-types: ["version-update:semver-major"]
      # BC 1.78.1 стабилен, новые версии не тестированы
      - dependency-name: "org.bouncycastle*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 2
    ignore:
      # v4 → v7 = API break, обновим вручную после регресс-теста
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle/actions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "softprops/action-gh-release"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci"
