name: CI
# Free-tier friendly: только PR + workflow_dispatch, не блокирует push в main.
# Не дублирует build.yml (сборка APK) — только быстрые проверки.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  actionlint:
    name: actionlint (workflow syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-check
          fail_level: error

  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
